<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Histórico de Análises</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>📜 Histórico de Análises</h1>

{% if analises %}
    <ul>
        {% for analise in analises %}
        <li>
            <strong>{{ analise[3] }}</strong> <!-- Data -->
            <p>{{ analise[2][:500] }}...</p> <!-- Preview do texto -->
            <a href="{{ url_for('ver_analise', id=analise[0]) }}">Ver análise completa</a>
        </li>
        {% endfor %}
    </ul>
{% else %}
    <p>Nenhuma análise encontrada ainda.</p>
{% endif %}


    <p><a href="{{ url_for('index') }}">⬅ Voltar</a></p>
</body>
</html>
